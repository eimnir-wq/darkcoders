services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: dark-coders-web:latest
    container_name: dark-coders-web
    restart: unless-stopped
    ports:
      - "5555:5555"
    environment:
      NODE_ENV: production
      PORT: "5555"
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:5555}
    env_file:
      - .env
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5555/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - dark-coders

networks:
  dark-coders:
    driver: bridge
